    <!-- Cache Control Meta Tags to Prevent Stale/Old Commit Flashes -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    
    <script id="kill-service-workers">
  // Force document title to brand name and protect from Framer runtime overrides
  let brandTitle = "Global Logic Media";
  const titleObserver = new MutationObserver(function() {
    if (document.title !== brandTitle) {
      document.title = brandTitle;
    }
  });

  function initTitleLock() {
    const titleEl = document.querySelector('title');
    if (titleEl) {
      brandTitle = titleEl.textContent;
      document.title = brandTitle;
      titleObserver.observe(titleEl, { characterData: true, childList: true });
    }
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', initTitleLock);
  } else {
    initTitleLock();
  }

  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.getRegistrations().then(function(registrations) {
      for (let registration of registrations) {
        registration.unregister().then(function() {
          console.log('Stale service worker unregistered!');
        });
      }
    });
  }
  if ('caches' in window) {
    caches.keys().then(function(names) {
      for (let name of names) {
        caches.delete(name);
      }
    });
  }
</script>

    <style>
        :root {
            --bg: #FFFDF0;
            --surface: #ffffff;
            --border: rgba(226, 0, 1, 0.12);
            --text: #111827;
            --text-muted: #4b5563;
            --primary: #e20001;
        }
        body {
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
            background-color: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }
        
        .hero {
            padding: 120px 5% 50px;
            text-align: center;
            position: relative;
        }
        
        .hero-bg-glow {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(226, 0, 1, 0.03) 0%, rgba(0,0,0,0) 70%);
            z-index: -1;
            pointer-events: none;
        }

        .hero h1 {
            font-size: clamp(2.5rem, 5vw, 4rem);
            margin: 0 0 1rem;
            color: #111827;
            letter-spacing: -1.5px;
            line-height: 1.1;
            font-weight: 900;
        }
        .hero p {
            font-size: 1.15rem;
            color: var(--text-muted);
            max-width: 620px;
            margin: 0 auto;
            line-height: 1.6;
        }
        .container {
            padding: 20px 5% 80px;
            flex-grow: 1;
            max-width: 1200px;
            margin: 0 auto;
            width: 100%;
            box-sizing: border-box;
        }
        .blog-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 28px;
        }
        .blog-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 16px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            cursor: pointer;
            opacity: 0;
            transform: translateY(30px);
            box-shadow: 0 4px 15px rgba(0,0,0,0.01);
            transition: border-color 0.3s, background 0.3s, transform 0.3s, box-shadow 0.3s;
        }
        .blog-card:hover {
            border-color: rgba(226, 0, 1, 0.25);
            background: #FFF9E6;
            transform: translateY(-4px);
            box-shadow: 0 10px 25px rgba(226, 0, 1, 0.05);
        }
        .blog-card:hover .blog-image img {
            transform: scale(1.04);
        }
        .blog-image {
            width: 100%;
            height: 200px;
            overflow: hidden;
            border-bottom: 1px solid var(--border);
        }
        .blog-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s ease-out;
        }
        .blog-content {
            padding: 22px;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }
        .blog-meta {
            display: flex;
            justify-content: space-between;
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-bottom: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 700;
        }
        .blog-category {
            color: var(--primary);
        }
        .blog-title {
            font-size: 1.2rem;
            margin: 0 0 0.8rem;
            line-height: 1.4;
            color: #111827;
            font-weight: 700;
        }
        .blog-excerpt {
            color: var(--text-muted);
            line-height: 1.5;
            margin: 0 0 1.2rem;
            font-size: 13.5px;
            flex-grow: 1;
        }
        .read-more {
            color: var(--primary);
            text-decoration: none;
            font-weight: 700;
            display: inline-flex;
            align-items: center;
            font-size: 13.5px;
            transition: color 0.2s;
        }
        .read-more::after {
            content: '→';
            margin-left: 0.4rem;
            transition: transform 0.2s;
        }
        .blog-card:hover .read-more::after {
            transform: translateX(4px);
        }
        .loading {
            text-align: center;
            color: var(--text-muted);
            padding: 4rem 0;
            font-size: 1.1rem;
        }

        /* Modal Overlay Reader */
        .glb-blog-modal {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            z-index: 10000;
            background: rgba(10, 14, 39, 0.4);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
            padding: 20px;
            box-sizing: border-box;
        }
        .glb-blog-modal.active {
            opacity: 1;
            pointer-events: auto;
        }
        .glb-blog-modal-content {
            background: #FFFDF0;
            border: 1px solid rgba(226, 0, 1, 0.2);
            border-radius: 20px;
            max-width: 750px;
            width: 100%;
            max-height: 85vh;
            overflow-y: auto;
            position: relative;
            box-shadow: 0 20px 50px rgba(0,0,0,0.15);
            transform: translateY(20px);
            transition: transform 0.3s ease;
        }
        .glb-blog-modal.active .glb-blog-modal-content {
            transform: translateY(0);
        }
        .glb-blog-modal-close {
            position: absolute;
            top: 16px; right: 16px;
            width: 36px; height: 36px;
            border-radius: 50%;
            background: #ffffff;
            border: 1px solid rgba(226, 0, 1, 0.15);
            color: #111827;
            font-size: 20px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 10;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            transition: all 0.2s;
        }
        .glb-blog-modal-close:hover {
            background: #e20001;
            color: #ffffff;
            border-color: #e20001;
        }
        .glb-blog-modal-img {
            width: 100%;
            height: 300px;
            object-fit: cover;
            border-bottom: 1px solid rgba(226, 0, 1, 0.1);
        }
        .glb-blog-modal-body {
            padding: 30px;
        }
        .glb-blog-modal-meta {
            display: flex;
            gap: 16px;
            font-size: 12px;
            font-weight: 700;
            color: #e20001;
            text-transform: uppercase;
            margin-bottom: 14px;
        }
        .glb-blog-modal-title {
            font-size: clamp(1.5rem, 4vw, 2.2rem);
            font-weight: 900;
            color: #111827;
            margin: 0 0 20px;
            line-height: 1.25;
            letter-spacing: -0.5px;
        }
        .glb-blog-modal-text {
            font-size: 15.5px;
            line-height: 1.7;
            color: #374151;
            margin: 0;
        }
        .glb-blog-modal-text p {
            margin-bottom: 16px;
        }
    </style>
</head>

  <script>
      // Register Menu Drawer Toggles
      const menuToggle = document.getElementById('glbMenuToggle');
      const drawerClose = document.getElementById('glbDrawerClose');
      const drawerOverlay = document.getElementById('glbDrawerOverlay');
      const mobileDrawer = document.getElementById('glbMobileDrawer');

      if (menuToggle && mobileDrawer) {
        menuToggle.addEventListener('click', () => {
          mobileDrawer.classList.add('active');
        });
      }
      if (drawerClose && mobileDrawer) {
        drawerClose.addEventListener('click', () => {
          mobileDrawer.classList.remove('active');
        });
      }
      if (drawerOverlay && mobileDrawer) {
        drawerOverlay.addEventListener('click', () => {
          mobileDrawer.classList.remove('active');
        });
      }

      // Default articles with complete readable copy content
      const defaultBlogs = [
          { 
            title: "10 Reasons Why You Need a Premium Website", 
            excerpt: "A website is no longer just a digital business card. Learn how premium design converts visitors into high-paying clients automatically.", 
            category: "Marketing", 
            date: "Aug 12, 2026", 
            image: "https://images.unsplash.com/photo-1460925895917-afdab827c52f?ixlib=rb-4.0.3&auto=format&fit=crop&w=800&q=80",
            body: `<p>In today's hyper-competitive digital landscape, a generic template website is no longer enough to set your business apart. Your website is your digital storefront, and it is often the first point of contact potential customers have with your brand.</p>
                   <p>A premium custom website offers ten primary advantages that directly impact your bottom line:</p>
                   <ul>
                     <li><strong>Speed Optimization</strong>: High-fidelity loading reduces bounce rates and keeps users engaged.</li>
                     <li><strong>Credibility</strong>: Award-winning visual designs convey authority and instantly build customer trust.</li>
                     <li><strong>Custom UI/UX</strong>: Tailored interfaces align with your business goals and guide users naturally to conversion.</li>
                     <li><strong>Search Engine Visibility (SEO)</strong>: Optimized code structures rank higher in search results.</li>
                     <li><strong>Mobile Responsiveness</strong>: Flawless layout scaling across all mobile devices.</li>
                     <li><strong>Advanced Customization</strong>: Zero reliance on cookie-cutter templates or clunky plugins.</li>
                     <li><strong>Conversion Funnels</strong>: Strategically placed lead capture forms and Call-to-Actions (CTAs).</li>
                     <li><strong>Third-Party Integrations</strong>: Seamlessly connect CRMs, analytical tracking tools, and custom dashboards.</li>
                     <li><strong>Enterprise Security</strong>: Strict data containment protocols and modern secure headers.</li>
                     <li><strong>Ownership & Control</strong>: Custom builds are asset assets that you own fully, free from platform restrictions.</li>
                   </ul>
                   <p>Investing in custom development ensures your brand remains memorable and consistently turns visitors into active, paying clients.</p>`
          },
          { 
            title: "The Future of SEO: AI Search & Ranking Factors", 
            excerpt: "Search engines are evolving faster than ever. Learn how to adapt your content strategy to rank higher in an AI-driven search landscape.", 
            category: "SEO", 
            date: "Aug 05, 2026", 
            image: "https://images.unsplash.com/photo-1573164713988-8665fc963095?ixlib=rb-4.0.3&auto=format&fit=crop&w=800&q=80",
            body: `<p>The search engine ranking ecosystem is undergoing its most significant evolution since the mobile revolution. The introduction of AI Search Overviews, conversational bots (like Perplexity and ChatGPT), and Google's continuous core updates are changing the way users discover information online.</p>
                   <p>To rank in an AI-dominated landscape, your content and engineering strategy must adapt:</p>
                   <p><strong>1. Direct Answer Optimization</strong>: AI engines look for structured, concise answers to complex conversational queries. Using clean schemas and clear, readable headings is critical.</p>
                   <p><strong>2. Topical Authority Maps</strong>: Gone are the days of single-keyword density. Search engines now evaluate your site's overall depth on a topic. Building authoritative hubs with rich internal linking is essential.</p>
                   <p><strong>3. Speed and Technical Health</strong>: Core Web Vitals remain a top ranking signal. High loading speed directly correlates with high rankings and conversion rates.</p>
                   <p><strong>4. Authentic Experience & Trust</strong>: Focus on E-E-A-T (Experience, Expertise, Authoritativeness, and Trustworthiness). Original studies, professional credentials, and authentic user reviews are more valuable than ever.</p>
                   <p>Adapting early to conversational search dynamics guarantees that your business dominates the digital landscape of tomorrow.</p>`
          },
          { 
            title: "Why First Impressions Matter: Web Design Basics", 
            excerpt: "Your website is your digital storefront. We explore the psychological impact of clean UI/UX and fast loading speeds on customer conversion rates.", 
            category: "Design", 
            date: "Jul 28, 2026", 
            image: "https://images.unsplash.com/photo-1547658719-da2b51169166?ixlib=rb-4.0.3&auto=format&fit=crop&w=800&q=80",
            body: `<p>User psychology dictates that a customer forms a firm opinion about your business within 50 milliseconds of landing on your homepage. That split-second judgment determines whether they stay, browse, and buy—or click away to a competitor.</p>
                   <p>Here are the key visual design fundamentals that influence user perception:</p>
                   <p><strong>1. Clear Visual Hierarchy</strong>: Guide the user's eye to what is most important first. Large headings, high-contrast badges, and well-designed negative space reduce visual fatigue.</p>
                   <p><strong>2. Micro-Interactions</strong>: Subtle hover effects, smooth transitions, and tactile button animations create a premium, interactive feel that delights visitors.</p>
                   <p><strong>3. Mobile Alignment</strong>: With over 60% of web traffic originating on mobile, responsive layouts that containment elements perfectly within mobile margins are a absolute requirement.</p>
                   <p><strong>4. Consistent Typography & Color Palette</strong>: Strict adherence to premium fonts (like Satoshi or Inter) and clean branding colors establishes a sense of professionalism and consistency.</p>
                   <p>By blending artistic design with performance-focused engineering, your website becomes a conversion engine that elevates your brand identity.</p>`
          }
      ];

      // Article Reader Modal control functions
      const blogModal = document.getElementById('glbBlogModal');
      const blogModalClose = document.getElementById('glbBlogModalClose');
      const blogModalOverlay = document.getElementById('glbBlogModalOverlay');
      
      const modalImg = document.getElementById('glbModalImg');
      const modalCategory = document.getElementById('glbModalCategory');
      const modalDate = document.getElementById('glbModalDate');
      const modalTitle = document.getElementById('glbModalTitle');
      const modalText = document.getElementById('glbModalText');

      function openArticle(blog) {
        if (!blogModal) return;
        modalImg.src = blog.image;
        modalImg.alt = blog.title;
        modalCategory.textContent = blog.category;
        modalDate.textContent = blog.date;
        modalTitle.textContent = blog.title;
        modalText.innerHTML = blog.body || `<p>${blog.excerpt}</p><p>Full content is currently loading or has not been configured yet.</p>`;
        
        blogModal.classList.add('active');
      }

      function closeArticle() {
        if (blogModal) {
          blogModal.classList.remove('active');
        }
      }

      if (blogModalClose) blogModalClose.addEventListener('click', closeArticle);
      if (blogModalOverlay) blogModalOverlay.addEventListener('click', closeArticle);

      async function fetchAndRenderBlogs() {
          let allBlogs = [...defaultBlogs];
          const blogGrid = document.getElementById('blogGrid');
          
          try {
              if (window.firebaseDB) {
                  const snapshot = await window.firebaseDB.ref("blogs").orderByChild("createdAt").once('value');
                  if (snapshot.exists()) {
                      let dbBlogs = [];
                      snapshot.forEach(child => dbBlogs.push(child.val()));
                      dbBlogs.reverse();
                      allBlogs = [...dbBlogs, ...defaultBlogs];
                  }
              } else {
                  let storedBlogs = JSON.parse(localStorage.getItem('glb_blogs')) || [];
                  allBlogs = [...storedBlogs, ...defaultBlogs];
              }
          } catch (e) {
              console.error("Error fetching blogs:", e);
          }

          let html = '';
          allBlogs.forEach((blog, idx) => {
              // Ensure body exists in data or fallback
              if (!blog.body) {
                blog.body = `<p>${blog.excerpt}</p><p>Discover premium insights, design heuristics, and digital scaling strategies curated by the Global Logic Media team.</p>`;
              }
              html += `
                  <article class="blog-card" data-index="${idx}">
                      <div class="blog-image">
                          <img src="${blog.image}" alt="${blog.title}">
                      </div>
                      <div class="blog-content">
                          <div class="blog-meta">
                              <span class="blog-category">${blog.category}</span>
                              <span>${blog.date}</span>
                          </div>
                          <h2 class="blog-title">${blog.title}</h2>
                          <p class="blog-excerpt">${blog.excerpt}</p>
                          <a href="#" class="read-more" onclick="event.preventDefault();">Read Article</a>
                      </div>
                  </article>
              `;
          });
          blogGrid.innerHTML = html;

          // Add card click listeners
          document.querySelectorAll('.blog-card').forEach(card => {
            card.addEventListener('click', () => {
              const idx = card.dataset.index;
              openArticle(allBlogs[idx]);
            });
          });

          // Animate cards in after render
          if (typeof gsap !== 'undefined') {
            gsap.fromTo(".blog-card", 
              { opacity: 0, y: 30 },
              {
                opacity: 1,
                y: 0,
                duration: 0.7,
                stagger: 0.12,
                ease: "power3.out",
                scrollTrigger: {
                  trigger: ".blog-grid",
                  start: "top 90%"
                }
              }
            );
            if (typeof ScrollTrigger !== 'undefined') ScrollTrigger.refresh();
          }
      }

      if (window.firebaseReady) {
          fetchAndRenderBlogs();
      } else {
          window.addEventListener('firebase-ready', fetchAndRenderBlogs);
          setTimeout(() => {
              const grid = document.getElementById('blogGrid');
              if (grid && grid.innerHTML.includes('Fetching')) fetchAndRenderBlogs();
          }, 2500);
      }
  </script>
  
  <!-- Load the custom footer -->
  <script src="custom-footer.js?v=1.1"></script>
</body>
